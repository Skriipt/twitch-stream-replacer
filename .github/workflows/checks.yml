name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check version increment and release notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run version:check -- --base "$BASE_SHA"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check
      - run: npm run package:extension

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: extension-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run package:extension
      - run: node scripts/version.mjs notes > dist/release-notes.md
      - name: Publish extension release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('extension/manifest.json')).version")
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          state=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          if [ "$state" = "false" ]; then
            echo "Release $tag is already published."
            exit 0
          fi
          if [ -z "$state" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file dist/release-notes.md --draft
          fi
          gh release upload "$tag" "dist/stream-bridge-$version.zip" "dist/stream-bridge-$version.zip.sha256" --clobber
          gh release edit "$tag" --draft=false
