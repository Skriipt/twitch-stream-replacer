<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Twitch Stream Replacer</title>
  <desc id="desc">A Twitch page where the video area shows the YouTube livestream in coral and the native Twitch chat stays on the right in purple.</desc>

  <rect width="1200" height="400" rx="26" fill="#18181B"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(64 56)" fill="none" stroke-width="8" stroke-linecap="round">
      <path d="M8 40V27C8 20 13 15 20 15H28" stroke="#A78BFA"/>
      <path d="M28 15H36C43 15 48 20 48 27V40" stroke="#FF655C"/>
    </g>
    <text x="136" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#A1A1AA">CHROMIUM EXTENSION · MV3</text>
    <text x="64" y="188" font-size="68" font-weight="800" fill="#FAFAFA">Twitch Stream</text>
    <text x="64" y="260" font-size="68" font-weight="800" fill="#FAFAFA">Replacer</text>
    <text x="64" y="316" font-size="26" fill="#D4D4D8">Watch the YouTube livestream on Twitch.</text>
    <text x="64" y="352" font-size="26" fill="#D4D4D8">Keep the Twitch chat.</text>
  </g>

  <g id="page-proof" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">
    <rect x="704" y="70" width="432" height="260" rx="16" fill="#1F1F23" stroke="#3F3F46" stroke-width="2"/>

    <rect x="724" y="90" width="268" height="150" rx="10" fill="#2A2A30" stroke="#FF655C" stroke-width="3"/>
    <path d="M840 138C840 134.5 843.8 132.3 846.8 134L874 149.7C877 151.4 877 155.7 874 157.4L846.8 173.1C843.8 174.8 840 172.600 840 169.100V138Z" fill="#FAFAFA"/>
    <text x="740" y="116" fill="#FF655C">YOUTUBE</text>

    <circle cx="742" cy="270" r="14" fill="#3F3F46"/>
    <rect x="768" y="258" width="130" height="10" rx="5" fill="#52525B"/>
    <rect x="768" y="276" width="86" height="8" rx="4" fill="#3F3F46"/>

    <rect x="1008" y="90" width="108" height="220" rx="10" fill="#1F1F23" stroke="#A78BFA" stroke-width="3"/>
    <text x="1022" y="116" fill="#A78BFA">CHAT</text>
    <g fill="#A78BFA" opacity="0.85">
      <rect x="1022" y="138" width="60" height="8" rx="4"/>
      <rect x="1022" y="168" width="78" height="8" rx="4" opacity="0.55"/>
      <rect x="1022" y="198" width="48" height="8" rx="4"/>
      <rect x="1022" y="228" width="82" height="8" rx="4" opacity="0.55"/>
      <rect x="1022" y="258" width="56" height="8" rx="4"/>
    </g>
  </g>
</svg>
